<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="address" style="padding: 0.2rem; font-size: 1.4rem; font-weight: 200;"></div>
        <div class="temp" style="padding: 0.1rem; font-size: 4rem;"></div>
        <span>
            <div class="condition"></div>
            <div> | </div>
            <span class="temps">
                <span><b>H: </b> <div class="max"></div> </span>
                <span><b>L: </b> <div class="min"></div> </span>
                <span><b>Feels like: </b> <div class="feels_like"></div> </span>
            </span>
        </span>

    </header>

    
    <div class="details">
        <span>
            <h3 class="currentLocation"></h3>
            <div class="description"></div>
        </span>
    </div>

    <span>
        <h3 style="padding: 0.5rem;">Hourly Forecast: </h3>
        <div class="hourlyCardsContainer"> </div>
    </span>
    
    <span>
        <h3 style="padding: 0.5rem;">Daily Forecast: </h3>
        <div class="dailyCardsContainer"></div>
    </span>

    <span>
        <div class="precipitation"></div>
        <div class="humidity"></div>
    </span>

    <script src="script.js"></script>
</body>
</html>
